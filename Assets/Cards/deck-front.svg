<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="300"
   height="450"
   viewBox="0 0 300 450"
   version="1.1"
   id="svg7"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs7" />
  <!-- Sfondo carta -->
  <rect
     x="0"
     y="0"
     width="300"
     height="450"
     rx="20"
     ry="20"
     fill="#fdfdf9"
     stroke="#222222"
     stroke-width="2"
     id="rect1" />
  <!-- Margine interno (safe area per contenuti) -->
  <rect
     x="20"
     y="20"
     width="260"
     height="410"
     rx="16"
     ry="16"
     fill="none"
     stroke="#cccccc"
     stroke-width="1"
     stroke-dasharray="4, 4"
     id="rect2" />
  <!-- Area titolo / simbolo in alto -->
  <rect
     x="40"
     y="40"
     width="220"
     height="60"
     fill="none"
     stroke="none"
     id="rect3" />
  <!-- Area centrale (illustrazione) -->
  <rect
     x="40"
     y="140"
     width="220"
     height="120"
     fill="none"
     stroke="#dddddd"
     stroke-width="1"
     stroke-dasharray="6, 3"
     id="rect4" />
  <!-- Area descrizione / testo effetti in basso -->
  <rect
     x="40"
     y="340"
     width="220"
     height="70"
     fill="none"
     stroke="none"
     id="rect5" />
  <!-- Placeholder testo (puoi rimuoverlo) -->
  <text
     x="150"
     y="120"
     text-anchor="middle"
     font-family="'Cormorant Garamond SemiBold'"
     font-size="50px"
     fill="#333333"
     id="text5">Titolo</text>
  <text
     x="150"
     y="200"
     text-anchor="middle"
     font-family="sans-serif"
     font-size="16px"
     fill="#555555"
     id="text6">Spazio per simbolo o illustrazione</text>
  <text
     x="150"
     y="300"
     text-anchor="middle"
     font-family="sans-serif"
     font-size="14px"
     fill="#555555"
     id="text7">Testo descrizione effetti</text>
</svg>
