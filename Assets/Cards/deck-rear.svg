         x1="0"
         y1="0"
         x2="40"
         y2="40"
         stroke="#3a2a20"
         stroke-width="1"
         opacity="0.35"
         id="line1" />
      <line
         x1="40"
         y1="0"
         x2="0"
         y2="40"
         stroke="#3a2a20"
         stroke-width="1"
         opacity="0.35"
         id="line2" />
      <!-- Rombo centrale -->
