<svg xmlns="http://www.w3.org/2000/svg" width="420" height="780" viewBox="0 0 420 780">

  <!-- ═══════════════════════════════════════
       ChastiMaid — Punishment List Dialog
       PORTRAIT  ·  420 × 780 px
       Standard modal dialog: semi-transparent
       scrim over the dashboard, centered box.
       Same BaseDialog template used for all
       modals (punishments, permissions, shop).
       ═══════════════════════════════════════ -->

  <!-- ── FADED DASHBOARD BACKGROUND ─────────── -->
  <rect width="420" height="780" fill="#F5F0E8"/>
  <rect width="420" height="50" fill="#EDE8DE" opacity="0.5"/>
  <rect x="16" y="62" width="388" height="112" rx="4" fill="#E8E0D0" opacity="0.3"/>
  <rect x="16" y="190" width="388" height="210" rx="2" fill="#E8E0D0" opacity="0.2"/>
  <rect x="16" y="408" width="388" height="48" rx="4" fill="#F5E6C8" opacity="0.2"/>
  <rect y="716" width="420" height="64" fill="#EDE8DE" opacity="0.4"/>

  <!-- ── SCRIM (full screen) ───────────────────── -->
  <rect width="420" height="780" fill="#2C2C2C" opacity="0.5"/>

  <!-- ── DIALOG BOX ───────────────────────────── -->
  <!-- Subtle drop shadow -->
  <rect x="33" y="163" width="360" height="384" rx="7" fill="#2C2C2C" opacity="0.12"/>
  <!-- Dialog surface -->
  <rect x="30" y="160" width="360" height="384" rx="6" fill="#F5F0E8" stroke="#C8B898" stroke-width="0.75"/>

  <!-- Dialog header (amber-tinted; signals warning/attention content) -->
  <rect x="30" y="160" width="360" height="50" rx="6" fill="#F5E6C8"/>
  <!-- Square off the bottom corners of header -->
  <rect x="30" y="192" width="360" height="18" fill="#F5E6C8"/>
  <line x1="30" y1="210" x2="390" y2="210" stroke="#C8882A" stroke-width="0.75"/>
  <!-- Header title -->
  <text x="52" y="185" dominant-baseline="middle"
        font-family="Georgia,'Times New Roman',serif" font-size="15" font-style="italic" fill="#5A3A08">Punishments</text>
  <!-- Close button -->
  <rect x="352" y="170" width="28" height="28" rx="4" fill="#EDD8A8" stroke="#C8882A" stroke-width="0.5"/>
  <text x="366" y="184" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="16" fill="#8A5A10">×</text>

  <!-- ── PUNISHMENT LIST ──────────────────────── -->

  <!-- Punishment row 1 (y 210–282) -->
  <text x="50" y="240" dominant-baseline="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#2C2C2C">Extra chores (1 hour)</text>
  <text x="50" y="258" dominant-baseline="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#9A9288">Assigned 15 Jan · No expiry</text>
  <!-- Start button -->
  <rect x="322" y="224" width="58" height="30" rx="4" fill="#2C2C2C"/>
  <text x="351" y="239" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#F5F0E8">Start</text>
  <!-- Row divider -->
  <line x1="44" y1="282" x2="376" y2="282" stroke="#C8C0B0" stroke-width="0.5"/>

  <!-- Punishment row 2 (y 282–354) -->
  <text x="50" y="312" dominant-baseline="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#2C2C2C">Standing time (30 min)</text>
  <text x="50" y="330" dominant-baseline="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#9A9288">Assigned 16 Jan · Expires tomorrow</text>
  <!-- Expiry accent (amber text for urgency) -->
  <!-- Start button -->
  <rect x="322" y="296" width="58" height="30" rx="4" fill="#2C2C2C"/>
  <text x="351" y="311" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#F5F0E8">Start</text>
  <!-- Row divider -->
  <line x1="44" y1="354" x2="376" y2="354" stroke="#C8C0B0" stroke-width="0.5"/>

  <!-- Empty area (represents scroll room for longer lists) -->
  <text x="210" y="416" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#D0C8BC">· · ·</text>
  <text x="210" y="434" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-style="italic" fill="#D0C8BC">scrollable if more items</text>

  <!-- ── DIALOG FOOTER ────────────────────────── -->
  <line x1="30" y1="494" x2="390" y2="494" stroke="#C8C0B0" stroke-width="0.5"/>
  <!-- Close / Dismiss button (centered) -->
  <rect x="150" y="504" width="120" height="30" rx="4" fill="#DDD8CE" stroke="#C8C0B0" stroke-width="0.5"/>
  <text x="210" y="519" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#2C2C2C">Close</text>

  <!-- Canvas label -->
  <text x="210" y="772" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-style="italic" fill="#C0B8AC">Portrait — Punishment Dialog (BaseDialog)</text>

</svg>
